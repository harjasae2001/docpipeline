services:
  - type: web
    name: docpipeline-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: api,supabase
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://ianwqptxwzbvwvehdmyd.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_S3_ENDPOINT
        value: https://ianwqptxwzbvwvehdmyd.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_STORAGE_REGION
        value: ap-south-1
      - key: SUPABASE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: worker
    name: docpipeline-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: worker,supabase
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://ianwqptxwzbvwvehdmyd.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_S3_ENDPOINT
        value: https://ianwqptxwzbvwvehdmyd.storage.supabase.co/storage/v1/s3
      - key: SUPABASE_STORAGE_REGION
        value: ap-south-1
      - key: SUPABASE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_TEXTRACT_STAGING_BUCKET
        sync: false
      - key: AWS_TEXTRACT_KMS_KEY_ID
        sync: false
