name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths: ['src/**', 'pom.xml', 'Dockerfile', 'render.yaml']
  workflow_dispatch:

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - name: Deploy API
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_API_DEPLOY_HOOK }}"
      - name: Deploy worker
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}"
