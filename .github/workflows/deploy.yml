name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ─── Manual trigger ──────────────────────────────────────────────────────────
  # Go to GitHub → Actions → CI/CD Pipeline → Run workflow
  # Select which part to deploy without touching the other.
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        required: true
        default: 'frontend-only'
        type: choice
        options:
          - frontend-only
          - backend-only
          - all

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: docpipeline-app-dev        # matches aws_ecr_repository name in Terraform
  ECS_CLUSTER: docpipeline-cluster-dev       # matches aws_ecs_cluster name in Terraform
  ECS_SERVICE: docpipeline-service-dev       # matches aws_ecs_service name in Terraform
  CONTAINER_NAME: docpipeline-app            # matches container name in task definition

jobs:
  # ─── Backend tests (only runs when backend files change, or manual trigger) ──
  test:
    name: Test & Build (Backend)
    runs-on: ubuntu-latest
    # Run on push only when backend-relevant files changed, OR on manual trigger for backend/all
    if: |
      (github.event_name == 'push' && (
        contains(github.event.head_commit.modified, 'src/') ||
        contains(github.event.head_commit.modified, 'pom.xml') ||
        contains(github.event.head_commit.modified, 'Dockerfile')
      )) ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.deploy_target == 'backend-only' ||
        github.event.inputs.deploy_target == 'all'
      ))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: mvn verify -B
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  # ─── Frontend deploy (only runs when frontend files change, or manual trigger) ─
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    # Run when frontend files changed on push, OR always on manual trigger for frontend/all
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (
        github.event.inputs.deploy_target == 'frontend-only' ||
        github.event.inputs.deploy_target == 'all'
      ))
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          echo "Building with API URL: $VITE_API_BASE_URL"
          npm run build
          # Verify the correct URL is baked into the bundle
          echo "--- URL check in bundle ---"
          grep -r "cloudfront.net" dist/ --include="*.js" -l || echo "No cloudfront URL found in bundle"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy to S3
        working-directory: frontend
        run: aws s3 sync dist/ s3://${{ secrets.FRONTEND_BUCKET_NAME }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "CloudFront cache invalidated — new files will be live within 1-2 minutes ✅"

  # ─── Backend build + deploy (only runs when backend files change) ─────────────
  build-and-deploy:
    name: Build & Deploy (Backend)
    needs: test
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && (
          github.event.inputs.deploy_target == 'backend-only' ||
          github.event.inputs.deploy_target == 'all'
        ))
      )
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build JAR
        run: mvn package -DskipTests -B
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
      - name: Download task definition
        run: aws ecs describe-task-definition --task-definition docpipeline-app-dev --query taskDefinition > task-definition.json
      - name: Render new image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false # don't block for hours if tasks crash

      - name: Verify deployment health
        run: |
          echo "Waiting 60s for ECS to roll out new tasks..."
          sleep 60
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://d2qd8wd4iaw4vq.cloudfront.net/api/actuator/health 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i) — deployment successful ✅"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 30s..."
            sleep 30
          done
          echo "Health check did not pass after 5 minutes. Check CloudWatch logs."
          exit 1

  # ─── Terraform validation on PRs only ────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0
      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend=false
      - name: Terraform Validate
        working-directory: infra
        run: terraform validate
      - name: Terraform Format Check
        working-directory: infra
        run: terraform fmt -check -recursive
