spring:
  application:
    name: docpipeline
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:54322/postgres?sslmode=disable}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      initialization-fail-timeout: 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: app
        format_sql: true
    open-in-view: false
  flyway:
    enabled: false

app:
  supabase:
    url: ${SUPABASE_URL:http://localhost:54321}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:local-anon-key}
    secret-key: ${SUPABASE_SECRET_KEY:}
    jwt-issuer: ${SUPABASE_JWT_ISSUER:http://localhost:54321/auth/v1}
    jwt-audience: ${SUPABASE_JWT_AUDIENCE:authenticated}
  storage:
    endpoint: ${SUPABASE_STORAGE_S3_ENDPOINT:http://localhost:54321/storage/v1/s3}
    region: ${SUPABASE_STORAGE_REGION:local}
    access-key-id: ${SUPABASE_STORAGE_ACCESS_KEY_ID:stub}
    secret-access-key: ${SUPABASE_STORAGE_SECRET_ACCESS_KEY:local-anon-key}
    bucket-name: ${SUPABASE_STORAGE_BUCKET:docpipeline-private}
    presigned-url-expiration: 15m
  aws:
    region: ${AWS_REGION:ap-south-1}
    textract-staging-bucket: ${AWS_TEXTRACT_STAGING_BUCKET:}
    textract-kms-key-id: ${AWS_TEXTRACT_KMS_KEY_ID:}
  processing:
    max-attempts: ${PROCESSING_MAX_ATTEMPTS:3}
    visibility-timeout-seconds: ${PROCESSING_VISIBILITY_TIMEOUT_SECONDS:300}
    batch-size: ${PROCESSING_BATCH_SIZE:5}
    queue-poll-delay-ms: ${PROCESSING_QUEUE_POLL_DELAY_MS:5000}
    textract-poll-delay-ms: ${TEXTRACT_POLL_DELAY_MS:30000}
    reconciliation-delay-ms: ${UPLOAD_RECONCILIATION_DELAY_MS:60000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.docpipeline: INFO
    software.amazon.awssdk: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

---
spring:
  config:
    activate:
      on-profile: supabase
  flyway:
    enabled: true
    locations: classpath:db/migration-supabase
    default-schema: app
    schemas: app
    create-schemas: true
    # The hosted project was provisioned through Supabase migrations. Baseline that
    # non-empty schema at V1; fresh local databases still execute V1 normally.
    baseline-on-migrate: true
    baseline-version: 1

---
spring:
  config:
    activate:
      on-profile: worker
  main:
    web-application-type: none

---
spring:
  config:
    activate:
      on-profile: aws-rollback
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
  jpa:
    properties:
      hibernate:
        default_schema: public
